openapi: 3.0.3
info:
  title: Osigu Medical Orders API
  version: 1.0.0
  description: REST API for registering and querying medical orders.

servers:
  - url: http://localhost:5080

paths:
  /api/orders:
    post:
      summary: Register a medical order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              patientId: "12345"
              patientName: "Juan Perez"
              serviceCode: "LAB001"
              serviceDescription: "Hemograma"
              priority: "Normal"
      responses:
        '201':
          description: Order created in Pending status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      summary: Get medical orders
      operationId: getOrders
      parameters:
        - name: patientId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Pendiente, Procesada]
        - name: pageNumber
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paged collection of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/orders/{id}:
    get:
      summary: Get a medical order by id
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Medical order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - patientId
        - serviceCode
        - priority
      properties:
        patientId:
          type: string
        patientName:
          type: string
        serviceCode:
          type: string
        serviceDescription:
          type: string
        priority:
          type: string
          enum: [Normal, Urgente]

    CreateOrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
        patientName:
          type: string
        serviceCode:
          type: string
        serviceDescription:
          type: string
        priority:
          type: string
          enum: [Normal, Urgente]
        status:
          type: string
          enum: [Pendiente, Procesada]
        createdAt:
          type: string
          format: date-time

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
        patientName:
          type: string
        serviceCode:
          type: string
        serviceDescription:
          type: string
        priority:
          type: string
          enum: [Normal, Urgente]
        status:
          type: string
          enum: [Pendiente, Procesada]
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true

    PagedOrderResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
